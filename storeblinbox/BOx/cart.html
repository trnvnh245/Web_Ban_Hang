<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ Hàng - Mystery World Blind Box</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="cart.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="navbar">
      <div class="header-box">
        <div class="header-top-row">
          <a href="home.html" class="brand-logo">
            <div class="logo-icon"><i class="fa-solid fa-box-open"></i></div>
            <div class="logo-text">
              <span class="logo-title">MYSTERY WORLD</span>
              <span class="logo-sub">BLIND BOX STORE</span>
            </div>
          </a>
          <form class="header-search-form" action="shop.html" method="GET">
            <input
              type="text"
              name="search"
              class="header-search-input"
              placeholder="Tìm kiếm tên Blind Box, nhân vật..."
            />
            <button type="submit" class="header-search-btn">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>
          <div class="nav-actions">
            <a href="login.html" class="icon-btn account-link" title="Tài khoản"
              ><i class="fa-regular fa-user"></i> Tài khoản</a
            >
            <a href="cart.html" class="icon-btn" title="Giỏ hàng">
              <i class="fa-solid fa-bag-shopping"></i> Giỏ hàng
              <span class="cart-badge">0</span>
            </a>
          </div>
        </div>
        <div class="header-bottom-row">
          <nav class="nav-links-4">
            <a href="home.html" class="active"
              ><i class="fa-solid fa-house"></i> <span>Trang Chủ</span></a
            >
            <a href="new-arrivals.html"
              ><i class="fa-solid fa-fire"></i> <span>Sản Phẩm Mới</span></a
            >
            <a href="shop.html"
              ><i class="fa-solid fa-store"></i> <span>Cửa Hàng</span></a
            >
            <a href="brand-popmart.html"
              ><i class="fa-solid fa-tags"></i> <span>Thương Hiệu</span></a
            >
          </nav>
        </div>
      </div>
    </header>

    <!-- Nội dung Giỏ Hàng -->
    <main class="cart-page">
      <h2><i class="fa-solid fa-bag-shopping"></i> Giỏ Hàng Của Bạn</h2>

      <!-- Khu vực render giỏ hàng -->
      <div id="cartContent"></div>
    </main>

    <footer class="page-footer">
      &copy; 2026 Mystery World Blind Box Store — Đồ án Lập trình Web
    </footer>

    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        renderCartPage();
      });

      function renderCartPage() {
        const container = document.getElementById("cartContent");
        const cart = getCart();

        if (cart.length === 0) {
          const user = typeof getCurrentUser === "function" ? getCurrentUser() : null;
          container.innerHTML = `
            <div class="cart-empty" style="text-align:center; padding: 60px 20px; background:#fff; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.06); max-width:600px; margin: 40px auto;">
              <i class="fa-solid fa-bag-shopping" style="font-size: 56px; color: #d1d5db; margin-bottom: 16px;"></i>
              <h3 style="font-size: 20px; font-weight: 700; color: #374151; margin-bottom: 8px;">Giỏ hàng của bạn đang trống</h3>
              <p style="color: #6b7280; margin-bottom: 24px; font-size: 14.5px;">${!user ? 'Bạn chưa đăng nhập tài khoản. Vui lòng đăng nhập để xem và quản lý giỏ hàng.' : 'Hiện tại chưa có sản phẩm nào trong giỏ hàng.'}</p>
              <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                ${!user ? `<a href="login.html" class="btn-checkout" style="max-width: 200px; margin: 0;"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</a>` : ''}
                <a href="shop.html" class="btn-continue" style="max-width: 200px; margin-top: 0;"><i class="fa-solid fa-store"></i> Đến Cửa Hàng</a>
              </div>
            </div>`;
          return;
        }

        let rows = "";
        cart.forEach((item) => {
          const subtotal = item.price * item.quantity;
          rows += `
            <tr>
              <td>
                <div class="cart-product-cell">
                  <img src="${item.image}" alt="${item.name}" class="cart-product-img" />
                  <div class="cart-product-info">
                    <div class="cart-product-name">${item.name}</div>
                    <div class="cart-product-brand">${item.brand}</div>
                  </div>
                </div>
              </td>
              <td class="cart-price">${formatPrice(item.price)}</td>
              <td>
                <div class="qty-control">
                  <button type="button" onclick="fakeChangeQty('${item.id}', -1)">−</button>
                  <span class="qty-value">${item.quantity}</span>
                  <button type="button" onclick="fakeChangeQty('${item.id}', 1)">+</button>
                </div>
              </td>
              <td class="cart-subtotal">${formatPrice(subtotal)}</td>
            </tr>`;
        });

        const totalCount = getCartCount();
        const totalPrice = getCartTotal();

        container.innerHTML = `
          <div class="cart-demo-notice">
            <i class="fa-solid fa-circle-info"></i>
            <span>Giỏ hàng demo — Danh sách sản phẩm và số lượng được giữ cố định.</span>
          </div>

          <table class="cart-table">
            <thead>
              <tr>
                <th>Sản phẩm</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>

          <div class="cart-summary">
            <div class="cart-summary-box">
              <div class="summary-row">
                <span>Số lượng sản phẩm</span>
                <span>${totalCount} món</span>
              </div>
              <div class="summary-row total">
                <span>Tổng cộng</span>
                <span class="summary-value">${formatPrice(totalPrice)}</span>
              </div>
              <a href="checkout.html" class="btn-checkout">
                <i class="fa-solid fa-truck-fast"></i> TIẾN HÀNH ĐẶT HÀNG
              </a>
              <a href="shop.html" class="btn-continue">
                <i class="fa-solid fa-arrow-left"></i> Tiếp tục mua sắm
              </a>
            </div>
          </div>`;
      }

      /* Nút +/- chỉ là hình thức, hiện toast nhưng không thay đổi dữ liệu */
      function fakeChangeQty(id, delta) {
        if (typeof showToast === "function") {
          showToast("Giỏ hàng demo: Số lượng được giữ cố định.", "info", 1500);
        }
      }

      function removeItem(id) {
        if (typeof showToast === "function") {
          showToast("Website demo: Danh sách sản phẩm được giữ cố định, không xóa.", "info", 2000);
        }
      }
    </script>
  </body>
</html>
