<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thương Hiệu Blind Box - Mystery World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="product.css" />
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="shop1.css" />
    <link rel="stylesheet" href="style-detail-search.css" />
    <style>
      /* Thanh chọn 5 Thương hiệu */
      .brand-tabs-container {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 30px 0;
        flex-wrap: wrap;
      }
      .brand-tab-btn {
        padding: 10px 24px;
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 30px;
        font-weight: 600;
        font-size: 14px;
        color: #374151;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .brand-tab-btn.active,
      .brand-tab-btn:hover {
        background: #8b5cf6;
        color: #ffffff;
        border-color: #8b5cf6;
        box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
      }
    </style>
  </head>
  <body>
    <!-- Header chung -->
    <header class="navbar">
      <div class="header-box">
        <div class="header-top-row">
          <a href="home.html" class="brand-logo">
            <div class="logo-icon"><i class="fa-solid fa-box-open"></i></div>
            <div class="logo-text">
              <span class="logo-title">MYSTERY WORLD</span>
              <span class="logo-sub">BLIND BOX STORE</span>
            </div>
          </a>

          <form
            class="header-search-form"
            action="search-results.html"
            method="GET"
          >
            <input
              type="text"
              name="search"
              class="header-search-input"
              placeholder="Tìm kiếm tên Blind Box, nhân vật..."
            />
            <button type="submit" class="header-search-btn">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>

          <div class="nav-actions">
            <a href="login.html" class="icon-btn account-link" title="Tài khoản"
              ><i class="fa-regular fa-user"></i> Tài khoản</a
            >
            <a href="cart.html" class="icon-btn" title="Giỏ hàng">
              <i class="fa-solid fa-bag-shopping"></i> Giỏ hàng
              <span class="cart-badge">0</span>
            </a>
          </div>
        </div>

        <div class="header-bottom-row">
          <nav class="nav-links-4">
            <a href="home.html">
              <i class="fa-solid fa-house"></i>
              <span>Trang Chủ</span>
            </a>
            <a href="new-arrivals.html">
              <i class="fa-solid fa-fire"></i>
              <span>Sản Phẩm Mới</span>
            </a>
            <a href="shop.html">
              <i class="fa-solid fa-store"></i>
              <span>Cửa Hàng</span>
            </a>
            <a href="brand-popmart.html" class="active">
              <i class="fa-solid fa-tags"></i>
              <span>Thương Hiệu</span>
            </a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Khu vực chuyển đổi nhanh giữa 5 Thương hiệu -->
    <div class="brand-tabs-container">
      <button class="brand-tab-btn active" onclick="switchBrand('POP MART')">
        POP MART
      </button>
      <button class="brand-tab-btn" onclick="switchBrand('52TOYS')">
        52TOYS
      </button>
      <button class="brand-tab-btn" onclick="switchBrand('Sonny Angel')">
        Sonny Angel
      </button>
      <button class="brand-tab-btn" onclick="switchBrand('Smiski')">
        Smiski
      </button>
      <button class="brand-tab-btn" onclick="switchBrand('Tokidoki')">
        Tokidoki
      </button>
    </div>

    <!-- Bố cục chính: Cột trái Lọc nâng cao, Cột phải hiển thị sản phẩm -->
    <main class="shop-container" style="margin-top: 10px">
      <aside class="filter-sidebar">
        <div class="filter-title">
          <i class="fa-solid fa-sliders"></i> Bộ Lọc Thương Hiệu
        </div>
        <div class="filter-group">
          <label for="searchName">Tên hoặc Mã sản phẩm</label>
          <input
            type="text"
            id="searchName"
            class="filter-input"
            placeholder="Nhập tên hoặc mã (VD: P001)..."
          />
        </div>
        <div class="filter-group">
          <label for="brandDisplay">Thương hiệu hiện tại</label>
          <input
            type="text"
            id="brandDisplay"
            class="filter-input"
            readonly
            style="background: #f3f4f6; font-weight: 700; color: #8b5cf6"
          />
        </div>
        <div class="filter-group">
          <label for="collectionSelect">Bộ sưu tập</label>
          <select id="collectionSelect" class="filter-select">
            <option value="all">Tất cả bộ sưu tập</option>
            <option value="Hirono Monster's Carnival Series">
              Hirono Monster's Carnival
            </option>
            <option value="SKULLPANDA Where Time Dwells Series">
              SKULLPANDA Time Dwells
            </option>
            <option value="MEGA SPACE MOLLY 100%">MEGA SPACE MOLLY 100%</option>
            <option value="Sleepy Crayon Shin-chan Series">
              Sleepy Crayon Shin-chan
            </option>
            <option value="LuLu The Piggy Farm Life Series">
              LuLu The Piggy Farm Life
            </option>
          </select>
        </div>
        <div class="filter-group">
          <label for="categorySelect">Danh mục</label>
          <select id="categorySelect" class="filter-select">
            <option value="all">Tất cả danh mục</option>
            <option value="Blind Box">Blind Box</option>
            <option value="Mini Figure">Mini Figure</option>
            <option value="Designer Toy">Designer Toy</option>
            <option value="Robot / Mecha">Robot / Mecha</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Khoảng giá (VNĐ)</label>
          <div class="price-range">
            <input
              type="number"
              id="minPrice"
              class="filter-input"
              placeholder="Từ giá"
            />
            <span>-</span>
            <input
              type="number"
              id="maxPrice"
              class="filter-input"
              placeholder="Đến giá"
            />
          </div>
        </div>

        <button id="btnApplyFilter" class="btn-filter-apply">
          <i class="fa-solid fa-magnifying-glass"></i> Lọc sản phẩm
        </button>
        <button id="btnResetFilter" class="btn-filter-reset">Đặt lại</button>
      </aside>

      <section class="shop-main">
        <div class="shop-header">
          <h2 id="pageTitle" class="section-title">THƯƠNG HIỆU: POP MART</h2>
          <span id="brandResultCount" class="result-count">Hiển thị 0 sản phẩm</span>
        </div>

        <!-- Nhóm 1: Sản phẩm mới -->
        <div style="margin-bottom: 40px">
          <h3
            style="
              font-size: 18px;
              font-weight: 700;
              color: #dc2626;
              margin-bottom: 15px;
              border-bottom: 2px solid #dc2626;
              padding-bottom: 6px;
            "
          >
            <i class="fa-solid fa-fire"></i> Sản Phẩm Mới Phát Hành
          </h3>
          <div id="newProductGrid" class="product-grid"></div>
        </div>

        <!-- Nhóm 2: Sản phẩm hiện tại -->
        <div>
          <h3
            style="
              font-size: 18px;
              font-weight: 700;
              color: #1f2937;
              margin-bottom: 15px;
              border-bottom: 2px solid #1f2937;
              padding-bottom: 6px;
            "
          >
            <i class="fa-solid fa-box"></i> Sản Phẩm Hiện Tại
          </h3>
          <div id="currentProductGrid" class="product-grid"></div>
        </div>
      </section>
    </main>

    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script src="box.js"></script>
    <script>
      let currentActiveBrand = "POP MART";

      // Hàm chuẩn hóa chuỗi bỏ dấu tiếng Việt để tìm kiếm chính xác
      function removeVietnameseTones(str) {
        str = String(str || "").toLowerCase();
        str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
        str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
        str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
        str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
        str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
        str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
        str = str.replace(/đ/g, "d");
        return str.trim();
      }

      function parsePriceNum(priceVal) {
        if (typeof priceVal === "number") return priceVal;
        return parseInt(String(priceVal || "").replace(/[^\d]/g, ""), 10) || 0;
      }

      // Hàm render sản phẩm — click chuyển sang trang chi tiết (giống trang tìm kiếm)
      function renderBrandProducts(list, containerId) {
        const grid = document.getElementById(containerId);
        if (!grid) return;
        grid.innerHTML = "";

        if (list.length === 0) {
          grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #6b7280; padding: 25px 0;">Không tìm thấy sản phẩm phù hợp.</p>`;
          return;
        }

        list.forEach((item) => {
          const card = document.createElement("div");
          card.className = "product-card";
          card.style.position = "relative";

          let newBadge = item.isNew
            ? `<span class="badge-new" style="position: absolute; top: 15px; left: 15px; background-color: #dc2626; color: white; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 6px; z-index: 2; text-transform: uppercase;">New</span>`
            : "";

          card.innerHTML = `
            ${newBadge}
            <img src="${item.image}" alt="${item.name}" class="product-img" onclick="location.href='product-detail.html?id=${item.id}'" onError="this.src='https://via.placeholder.com/240x240'" />
            <div class="product-info">
              <div class="product-meta-top">
                <span class="product-brand">${item.brand}</span>
                <span class="product-sku">${item.id}</span>
              </div>
              <h3 class="product-title" onclick="location.href='product-detail.html?id=${item.id}'">${item.name}</h3>
              <div class="product-price">${item.price}</div>
              <div class="product-bottom-actions">
                <button class="btn-add-cart-red" onclick="location.href='product-detail.html?id=${item.id}'">
                  <i class="fa-solid fa-cart-shopping"></i> Mua ngay
                </button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      // Cập nhật danh sách Bộ sưu tập theo Thương hiệu đang chọn
      function updateBrandCollections(brandName) {
        const colSelect = document.getElementById("collectionSelect");
        if (!colSelect) return;
        const brandProducts = products.filter(
          (p) => p.brand.toLowerCase() === brandName.toLowerCase(),
        );
        const collections = Array.from(
          new Set(brandProducts.map((p) => p.collection).filter(Boolean)),
        );
        let optionsHtml = '<option value="all">Tất cả bộ sưu tập</option>';
        collections.forEach((col) => {
          optionsHtml += `<option value="${col}">${col}</option>`;
        });
        colSelect.innerHTML = optionsHtml;
      }

      // Xử lý bộ lọc nâng cao bên Sidebar — Chạy theo thời gian thực khi thêm, sửa, xóa mã hoặc tên
      function performBrandFilter() {
        const searchInput = document.getElementById("searchName");
        const rawKeyword = (searchInput ? searchInput.value : "").trim();
        const normKeyword = removeVietnameseTones(rawKeyword);

        const category = document.getElementById("categorySelect") ? document.getElementById("categorySelect").value : "all";
        const collection = document.getElementById("collectionSelect") ? document.getElementById("collectionSelect").value : "all";
        const minPrice = parseInt(document.getElementById("minPrice")?.value, 10);
        const maxPrice = parseInt(document.getElementById("maxPrice")?.value, 10);

        const brandProducts = products.filter(
          (p) => p.brand.toLowerCase() === currentActiveBrand.toLowerCase(),
        );

        const filtered = brandProducts.filter((p) => {
          // Lọc theo Mã và Tên sản phẩm (hoạt động ngay khi gõ thêm, sửa đổi hoặc xóa ký tự)
          const normName = removeVietnameseTones(p.name);
          const normId = removeVietnameseTones(p.id);
          const matchKeyword =
            !normKeyword ||
            normName.includes(normKeyword) ||
            normId.includes(normKeyword);

          // Lọc theo Danh mục
          const matchCat = category === "all" || p.category === category;

          // Lọc theo Bộ sưu tập
          const matchCol = collection === "all" || p.collection === collection;

          // Lọc theo Giá
          const priceNum = parsePriceNum(p.price);
          const matchMin = isNaN(minPrice) || priceNum >= minPrice;
          const matchMax = isNaN(maxPrice) || priceNum <= maxPrice;

          return matchKeyword && matchCat && matchCol && matchMin && matchMax;
        });

        renderBrandProducts(
          filtered.filter((p) => p.isNew),
          "newProductGrid",
        );
        renderBrandProducts(
          filtered.filter((p) => !p.isNew),
          "currentProductGrid",
        );

        // Cập nhật số lượng hiển thị
        const countEl = document.getElementById("brandResultCount");
        if (countEl) {
          countEl.innerText = `Hiển thị ${filtered.length} sản phẩm`;
        }
      }

      // Hàm tải và hiển thị dữ liệu theo thương hiệu được chọn
      function loadBrandData(brandName) {
        currentActiveBrand = brandName;
        document.getElementById("pageTitle").innerText =
          `THƯƠNG HIỆU: ${brandName.toUpperCase()}`;
        document.getElementById("brandDisplay").value = brandName;

        // Cập nhật trạng thái active cho các nút tab
        document.querySelectorAll(".brand-tab-btn").forEach((btn) => {
          if (btn.innerText.trim().toLowerCase() === brandName.toLowerCase()) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });

        // Cập nhật các bộ sưu tập của thương hiệu này
        updateBrandCollections(brandName);

        // Áp dụng bộ lọc hiện tại (hoặc hiển thị toàn bộ nếu chưa lọc)
        performBrandFilter();
      }

      // Khi click vào nút chuyển brand trên thanh tab
      function switchBrand(brandName) {
        // Reset ô tìm kiếm khi đổi thương hiệu để hiển thị đầy đủ
        const searchInput = document.getElementById("searchName");
        if (searchInput) searchInput.value = "";
        const catSelect = document.getElementById("categorySelect");
        if (catSelect) catSelect.value = "all";
        const minP = document.getElementById("minPrice");
        if (minP) minP.value = "";
        const maxP = document.getElementById("maxPrice");
        if (maxP) maxP.value = "";

        loadBrandData(brandName);
        // Cập nhật URL sạch không cần reload trang
        const newUrl = `${window.location.pathname}?brand=${encodeURIComponent(brandName.toLowerCase())}`;
        window.history.pushState({ path: newUrl }, "", newUrl);
      }

      document.addEventListener("DOMContentLoaded", () => {
        // Kiểm tra xem URL có truyền sẵn tham số brand hay không
        const urlParams = new URLSearchParams(window.location.search);
        const brandParam = urlParams.get("brand");

        if (brandParam) {
          const matched = [
            "popmart",
            "52toys",
            "sonny angel",
            "smiski",
            "tokidoki",
          ].find((b) => b.includes(brandParam.toLowerCase()));
          if (matched) {
            const formatted =
              products.find((p) => p.brand.toLowerCase() === matched)?.brand ||
              "POP MART";
            loadBrandData(formatted);
          } else {
            loadBrandData("POP MART");
          }
        } else {
          loadBrandData("POP MART");
        }

        // LẮNG NGHE SỰ KIỆN: Khi người dùng thêm, sửa, xóa ký tự trong ô Tên hoặc Mã sản phẩm
        const searchInput = document.getElementById("searchName");
        if (searchInput) {
          // Bắt sự kiện 'input': chạy ngay khi gõ thêm, sửa hoặc nhấn backspace/delete xóa ký tự
          searchInput.addEventListener("input", performBrandFilter);
          searchInput.addEventListener("keyup", performBrandFilter);
        }

        // Lắng nghe sự kiện thay đổi danh mục, bộ sưu tập, khoảng giá
        const categorySelect = document.getElementById("categorySelect");
        if (categorySelect) categorySelect.addEventListener("change", performBrandFilter);

        const collectionSelect = document.getElementById("collectionSelect");
        if (collectionSelect) collectionSelect.addEventListener("change", performBrandFilter);

        const minPriceInput = document.getElementById("minPrice");
        if (minPriceInput) minPriceInput.addEventListener("input", performBrandFilter);

        const maxPriceInput = document.getElementById("maxPrice");
        if (maxPriceInput) maxPriceInput.addEventListener("input", performBrandFilter);

        // Nút Lọc sản phẩm thủ công
        const btnApply = document.getElementById("btnApplyFilter");
        if (btnApply) {
          btnApply.addEventListener("click", performBrandFilter);
        }

        // Xử lý nút Đặt lại
        const btnReset = document.getElementById("btnResetFilter");
        if (btnReset) {
          btnReset.addEventListener("click", () => {
            if (searchInput) searchInput.value = "";
            if (categorySelect) categorySelect.value = "all";
            if (collectionSelect) collectionSelect.value = "all";
            if (minPriceInput) minPriceInput.value = "";
            if (maxPriceInput) maxPriceInput.value = "";
            loadBrandData(currentActiveBrand);
          });
        }
      });
    </script>
  </body>
</html>
