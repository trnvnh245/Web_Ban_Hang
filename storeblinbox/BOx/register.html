<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - Mystery World Blind Box</title>

    <!-- Font và biểu tượng dùng tài nguyên cục bộ -->
    <link
      rel="stylesheet"
      href="../assert/vendor/fontawesome/css/all.min.css"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="typography.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="navbar">
      <div class="header-box">
        <div class="header-top-row">
          <a href="index.html" class="brand-logo">
            <div class="logo-icon"><i class="fa-solid fa-box-open"></i></div>
            <div class="logo-text">
              <span class="logo-title">MYSTERY WORLD</span>
              <span class="logo-sub">BLIND BOX STORE</span>
            </div>
          </a>

          <form
            class="header-search-form"
            action="search-results.html"
            method="GET"
          >
            <input
              type="text"
              name="search"
              class="header-search-input"
              placeholder="Tìm kiếm tên Blind Box, nhân vật..."
            />
            <button type="submit" class="header-search-btn">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>

          <div class="nav-actions">
            <a href="login.html" class="icon-btn account-link" title="Đăng nhập"
              ><i class="fa-regular fa-user"></i> Tài khoản</a
            >
            <a href="cart.html" class="icon-btn" title="Giỏ hàng">
              <i class="fa-solid fa-bag-shopping"></i> Giỏ hàng
              <span class="cart-badge">0</span>
            </a>
          </div>
        </div>

        <div class="header-bottom-row">
          <nav class="nav-links-4">
            <a href="index.html">
              <i class="fa-solid fa-house"></i>
              <span>Trang Chủ</span>
            </a>
            <a href="new-arrivals.html">
              <i class="fa-solid fa-fire"></i>
              <span>Sản Phẩm Mới</span>
            </a>
            <a href="shop.html">
              <i class="fa-solid fa-store"></i>
              <span>Cửa Hàng</span>
            </a>
            <a href="brand-popmart.html">
              <i class="fa-solid fa-tags"></i>
              <span>Thương Hiệu</span>
            </a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Nội dung Đăng Ký -->
    <section class="auth-page">
      <div class="auth-container">
        <div class="auth-header">
          <i class="fa-solid fa-user-plus auth-icon"></i>
          <h2>Tạo Tài Khoản</h2>
          <p>Đăng ký để mua hàng và theo dõi đơn hàng của bạn</p>
        </div>

        <div id="registerMessage" class="auth-message"></div>

        <form id="registerForm" autocomplete="on">
          <div class="form-row">
            <div class="form-group">
              <label for="regFullName"
                >Họ và tên <span class="required">*</span></label
              >
              <div class="input-wrapper">
                <input
                  type="text"
                  id="regFullName"
                  class="form-input"
                  placeholder="Nguyễn Văn A"
                />
                <i class="fa-solid fa-id-card input-icon"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="regPhone"
                >Số điện thoại <span class="required">*</span></label
              >
              <div class="input-wrapper">
                <input
                  type="tel"
                  id="regPhone"
                  class="form-input"
                  placeholder="0901234567"
                  maxlength="10"
                />
                <i class="fa-solid fa-phone input-icon"></i>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="regUsername"
              >Tên đăng nhập <span class="required">*</span></label
            >
            <div class="input-wrapper">
              <input
                type="text"
                id="regUsername"
                class="form-input"
                placeholder="Từ 4–30 ký tự: chữ, số hoặc dấu _"
              />
              <i class="fa-solid fa-user input-icon"></i>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="regPassword"
                >Mật khẩu <span class="required">*</span></label
              >
              <div class="input-wrapper">
                <input
                  type="password"
                  id="regPassword"
                  class="form-input"
                  placeholder="Ít nhất 6 ký tự"
                />
                <i class="fa-solid fa-lock input-icon"></i>
                <button
                  type="button"
                  class="toggle-password"
                  data-target="regPassword"
                  title="Hiện/ẩn mật khẩu"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="regConfirmPassword"
                >Xác nhận mật khẩu <span class="required">*</span></label
              >
              <div class="input-wrapper">
                <input
                  type="password"
                  id="regConfirmPassword"
                  class="form-input"
                  placeholder="Nhập lại mật khẩu"
                />
                <i class="fa-solid fa-lock input-icon"></i>
                <button
                  type="button"
                  class="toggle-password"
                  data-target="regConfirmPassword"
                  title="Hiện/ẩn mật khẩu"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="regAddress"
              >Địa chỉ nhận hàng <span class="required">*</span></label
            >
            <textarea
              id="regAddress"
              class="form-textarea"
              placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"
            ></textarea>
          </div>

          <button type="submit" class="btn-auth btn-register">
            <i class="fa-solid fa-user-plus"></i> Đăng Ký
          </button>
        </form>

        <div class="auth-footer">
          Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
      </div>
    </section>

    <footer class="page-footer">
      &copy; 2026 Mystery World Blind Box Store — Đồ án Lập trình Web
    </footer>

    <script src="auth.js"></script>
  </body>
</html>
