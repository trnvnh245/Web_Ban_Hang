<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - Mystery World Blind Box</title>

    <!-- Font và biểu tượng dùng tài nguyên cục bộ -->
    <link
      rel="stylesheet"
      href="../assert/vendor/fontawesome/css/all.min.css"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="typography.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="navbar">
      <div class="header-box">
        <div class="header-top-row">
          <a href="home.html" class="brand-logo">
            <div class="logo-icon"><i class="fa-solid fa-box-open"></i></div>
            <div class="logo-text">
              <span class="logo-title">MYSTERY WORLD</span>
              <span class="logo-sub">BLIND BOX STORE</span>
            </div>
          </a>

          <form
            class="header-search-form"
            action="search-results.html"
            method="GET"
          >
            <input
              type="text"
              name="search"
              class="header-search-input"
              placeholder="Tìm kiếm tên Blind Box, nhân vật..."
            />
            <button type="submit" class="header-search-btn">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>

          <div class="nav-actions">
            <a href="login.html" class="icon-btn account-link" title="Đăng nhập"
              ><i class="fa-regular fa-user"></i> Tài khoản</a
            >
            <a href="cart.html" class="icon-btn" title="Giỏ hàng">
              <i class="fa-solid fa-bag-shopping"></i> Giỏ hàng
              <span class="cart-badge">0</span>
            </a>
          </div>
        </div>

        <div class="header-bottom-row">
          <nav class="nav-links-4">
            <a href="home.html">
              <i class="fa-solid fa-house"></i>
              <span>Trang Chủ</span>
            </a>
            <a href="new-arrivals.html">
              <i class="fa-solid fa-fire"></i>
              <span>Sản Phẩm Mới</span>
            </a>
            <a href="shop.html">
              <i class="fa-solid fa-store"></i>
              <span>Cửa Hàng</span>
            </a>
            <a href="brand-popmart.html">
              <i class="fa-solid fa-tags"></i>
              <span>Thương Hiệu</span>
            </a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Nội dung Đăng Nhập -->
    <section class="auth-page">
      <div class="auth-container">
        <div class="auth-header">
          <i class="fa-solid fa-user-astronaut auth-icon"></i>
          <h2>Chào Mừng Trở Lại</h2>
          <p>Đăng nhập để xem thông tin tài khoản và lịch sử mua hàng</p>
        </div>

        <div id="loginMessage" class="auth-message"></div>

        <form id="loginForm" autocomplete="on">
          <div class="form-group">
            <label for="loginUsername">Tên đăng nhập</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="loginUsername"
                name="username"
                class="form-input"
                placeholder="Nhập tên đăng nhập..."
              />
              <i class="fa-solid fa-user input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="loginPassword">Mật khẩu</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="loginPassword"
                name="password"
                class="form-input"
                placeholder="Nhập mật khẩu..."
              />
              <i class="fa-solid fa-lock input-icon"></i>
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                title="Hiện/ẩn mật khẩu"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-auth btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
          </button>
        </form>

        <div class="auth-divider">hoặc</div>

        <div class="demo-note">
          <i class="fa-solid fa-circle-info"></i>
          <span
            >Tài khoản demo: <strong>demo</strong> /
            <strong>123456</strong></span
          >
        </div>

        <button type="button" class="btn-auth btn-demo" id="demoLoginBtn">
          <i class="fa-solid fa-bolt"></i> Đăng Nhập Nhanh Bằng Tài Khoản Demo
        </button>

        <div class="auth-footer">
          Chưa có tài khoản?
          <a href="register.html">Đăng ký ngay</a>
        </div>
      </div>
    </section>

    <footer class="page-footer">
      &copy; 2026 Mystery World Blind Box Store — Đồ án Lập trình Web
    </footer>

    <script src="auth.js"></script>
  </body>
</html>
